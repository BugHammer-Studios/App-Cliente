<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Preciso Corte | Fila da barbearia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Fundo em camadas curvas (identidade visual do layout de referência) -->
  <div class="bg" aria-hidden="true"><span class="hill hill-1"></span><span class="hill hill-2"></span></div>

  <main class="app">

    <!-- TELA 1: Página inicial. Apresenta a barbearia e explica a fila. -->
    <section class="screen" id="tela-inicio">
      <h1 class="logo">Preciso Corte</h1>
      <p class="lead">Sem agendamento e sem escolher horário. Entre na fila e acompanhe sua vez pelo celular.</p>

      <button class="btn btn-claro" id="btn-entrar">Entrar na fila</button>

      <!-- Informações básicas (substitua pelos dados reais) -->
      <p class="info">Seg a Sáb, 9h às 19h<br>Rua Exemplo, 123 · Centro</p>
    </section>

    <!-- TELA 2: Identificação. Telefone e nome, sem senha. -->
    <section class="screen" id="tela-dados" hidden>
      <h2 class="logo pequeno">Preciso Corte</h2>
      <form id="form-dados" novalidate>
        <label for="telefone">Telefone</label>
        <input id="telefone" type="tel" inputmode="numeric" placeholder="(21) 99999-9999" autocomplete="tel" maxlength="15">
        <p class="erro" id="erro-telefone" role="alert"></p>

        <label for="nome">Nome</label>
        <input id="nome" type="text" placeholder="Seu nome" autocomplete="name" maxlength="50">
        <p class="erro" id="erro-nome" role="alert"></p>

        <button class="btn btn-claro" type="submit">Continuar</button>
        <button class="btn-link" type="button" data-voltar="tela-inicio">Voltar</button>
      </form>
    </section>

    <!-- TELA 3: Escolha da fila. -->
    <section class="screen" id="tela-fila" hidden>
      <h2 class="titulo">Em qual fila você quer entrar?</h2>
      <div class="opcoes">
        <button class="opcao" data-fila="barbeiro1">
          <strong>Barbeiro 1</strong>
        </button>
        <button class="opcao" data-fila="barbeiro2">
          <strong>Barbeiro 2</strong>
        </button>
        <button class="opcao" data-fila="geral">
          <strong>Fila geral</strong>
        </button>
      </div>
      <button class="btn-link" type="button" data-voltar="tela-dados">Voltar</button>
    </section>

    <!-- TELA 4: Resumo antes de confirmar a entrada. -->
    <section class="screen" id="tela-confirmar" hidden>
      <h2 class="titulo">Confirme sua entrada</h2>
      <dl class="resumo">
        <dt>Telefone</dt><dd id="res-telefone"></dd>
        <dt>Nome</dt><dd id="res-nome"></dd>
        <dt>Fila escolhida</dt><dd id="res-fila"></dd>
      </dl>
      <button class="btn btn-laranja" id="btn-confirmar">Confirmar entrada na fila</button>
      <button class="btn-link" type="button" data-voltar="tela-fila">Voltar</button>
    </section>

    <!-- TELA 5: Acompanhamento. Área responsável por exibir a posição atual do cliente.
         A classe estado-longe / estado-chegando / estado-vez é trocada pelo JavaScript
         e define a cor do ícone, do número e do status. -->
    <section class="screen tela-status estado-longe" id="tela-posicao" hidden>
      <p class="instrucao" id="instrucao">Você está esperando na fila.</p>

      <svg class="tesoura" viewBox="0 0 100 100" fill="none" stroke="currentColor"
           stroke-width="7" stroke-linecap="round" aria-hidden="true">
        <circle cx="30" cy="22" r="14"/>
        <circle cx="70" cy="22" r="14"/>
        <line x1="38" y1="34" x2="70" y2="92"/>
        <line x1="62" y1="34" x2="30" y2="92"/>
      </svg>

      <p class="numero" id="posicao" aria-live="polite">5º</p>
      <p class="status" id="status">Em espera</p>

      <button class="btn-sair" id="btn-sair" type="button">Sair da fila</button>
    </section>

  </main>
  <script src="config.js"></script>
  <script src="firebase.js"></script>
  <script src="script.js"></script>
</body>
</html>
